name: Deploy ZIP to Server (Private Repo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Extract ZIP via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Pasamos el token del sistema como una variable de entorno al script SSH
          envs: GITHUB_TOKEN
          script: |
            cd ~/proyectos
            
            # Descargar el ZIP usando el token de autenticación en la cabecera
            curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
              -o repo.zip \
              https://github.com{{ github.repository }}/zipball/main
            
            # Descomprimir los archivos sobreescribiendo los anteriores
            unzip -o repo.zip
            
            # Mover los archivos fuera de la carpeta interna que genera GitHub hacia la raíz de proyectos
            # (GitHub crea una carpeta llamada 'nombreusuario-nombrerepo-hash')
            mv */* . 2>/dev/null || true
            rm -rf */ 2>/dev/null || true
            
            # Eliminar el archivo ZIP temporal
            rm repo.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

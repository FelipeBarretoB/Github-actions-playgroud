name: Deploy TAR to Server (Private Repo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Extract TAR via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          # Pasamos tanto el token como el nombre del repositorio al servidor
          envs: GITHUB_TOKEN, REPO_NAME
          script: |
            cd ~/proyectos
            
            # Ahora usamos la variable de entorno de Linux ($REPO_NAME) en lugar de las llaves de GitHub
            curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
              -o repo.tar.gz \
              "https://github.com/$REPO_NAME/tarball/main"
            
            # Descomprimir con la herramienta nativa de Ubuntu
            tar -xzf repo.tar.gz --strip-components=1
            
            # Eliminar el archivo temporal
            rm repo.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
